<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ecommerce Website</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- breadcrumb start here  -->
    <div class="container fs-5">
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="index.html" class="text-decoration-none">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="product.html" class="text-decoration-none">Product</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Shopping-cart</li>
            </ol>
        </nav>
    </div>

    <!-- product list start here  -->
    <h2 class="text-center mt-5 mb-3">
        <span class="border-bottom border-4 border-danger pb-1">Product List</span>
    </h2>

    <div class="container">
        <div class="col-md-10 border border-1 border-secondary p-2 mx-auto">
            <div class="row">
                <div class="col-md-3">
                    <h5>Product image</h5>
                </div>
                <div class="col-md-3">
                    <h5>Product Name</h5>
                </div>
                <div class="col-md-3">
                    <h5>Product price</h5>
                </div>
                <div class="col-md-3">
                    <h5>Product Quantity</h5>
                </div>
            </div>
            <hr>
            <div class="row align-items-center">
                <div class="col-md-3">
                    <img src="image/product1.png" alt="" class="img-fluid img-thumbnail">
                </div>
                <div class="col-md-3">
                    <h6>Casual Shoes</h6>
                </div>
                <div class="col-md-3">
                    <p>Price: BDT-500 Taka</p>
                </div>
                <div class="col-md-3">
                    <input type="number" name="quantity" id="" class="form-control">
                </div>
            </div>

            <div class="row align-items-center mt-2">
                <div class="col-md-3">
                    <img src="image/product2.jpg" alt="" class="img-fluid img-thumbnail">
                </div>
                <div class="col-md-3">
                    <h6>Smart Watches</h6>
                </div>
                <div class="col-md-3">
                    <p>Price: BDT-500 Taka</p>
                </div>
                <div class="col-md-3">
                    <input type="number" name="quantity" id="" class="form-control">
                </div>
            </div>
        </div>
        <!-- Cart Total Summery start here  -->
        <div class="col-md-10 mx-auto border border-1 border-secondary mt-1">
            <div class="row">
                <div class="col-md-8">
                    <H6>Total Price :</H6>
                </div>
                <div class="col-md-4">
                    <h6>1000 Taka</h6>
                </div>
            </div>
        </div>
    </div>

    <!-- coupon start here  -->

    <div class="container mt-5 mb-5">
        <h2 class="col-md-10 mx-auto mb-3">
            <span class="border-bottom border-4 border-danger pb-1">Add Coupun</span>
        </h2>
        <div class="border border-1 border-secondary col-md-10 mx-auto p-2">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <p>Add Coupon Here</p>
                </div>
                <div class="col-md-3">
                    <input type="text" name="coupon" id="" class="form-control">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-outline-secondary">Coupon submit</button>
                </div>
                <div class="col-md-3">
                    <p>Discount Price: 100 Taka</p>
                </div>
            </div>
        </div>

        <button class="btn btn-outline-info mt-2 mx-auto d-block w-50">Confirm Order</button>
    </div>





    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
